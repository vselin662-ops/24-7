version: '3.8'

services:
  selin-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selin-ai-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data

  redis:
    image: redis:alpine
    container_name: selin-ai-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  redis_data:
